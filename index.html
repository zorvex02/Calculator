  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="icon" href="calculator.png" type="image.png">
  </head>
  <body id="calculator-body">
    <div id="calculator">
      <label for="textinput" id="textlabel">Standard</label>
      <br>
       <div class="inputwrapper">
        <input type="text" id="textinput">
       </div>
       <br>
       <audio src="r"></audio>
       <div id="button-wrapper">
         <button type="button" id="percent">%</button>
         <button type="button" id="deepclear">CE</button>
         <button type="button" id="clear">C</button>
         <button type="button" id="backspace">⌫</button>
        </div>
        
        <div id="button-wrapper">
          <button type="button" id="fraction">1/x</button>
          <button type="button" id="square">x`2</button>
          <button type="button" id="square-root">2/x</button>
          <button type="button" id="division">÷</button>
      </div>
      
      <div id="button-wrapper">
        <button type="button" id="seven">7</button>
        <button type="button" id="eight">8</button>
        <button type="button" id="nine">9</button>
        <button type="button" id="multiplication">x</button>
      </div>
      
      <div id="button-wrapper">
        <button type="button" id="four">4</button>
        <button type="button" id="five">5</button>
        <button type="button" id="six">6</button>
        <button type="button" id="subtraction">_</button>
      </div> 
      
      <div id="button-wrapper">
        <button type="button" id="one">1</button>
        <button type="button" id="two">2</button>
        <button type="button" id="three">3</button>
        <button type="button" id="addition">+</button>
      </div>
      
      <div id="button-wrapper">
        <button type="button" id="plus-minus">+/-</button>
        <button type="button" id="zero">0</button>
        <button type="button" id="decimalpoint">.</button>
        <button type="button" id="equalsign">=</button>
      </div>
      <footer>© 2026 Temitope Emmanuel - Calculator App</footer>
    </div>
    <script src="calculator.js"></script>
  </body>
  </html>
