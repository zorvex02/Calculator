  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="icon" href="calculator.png" type="image.png">
  </head>
  <body id="calculator-body">
    <div id="calculator">
      <label for="textinput" id="textlabel">Standard</label>
      <br>
       <div class="inputwrapper">
        <input type="text" id="textinput">
       </div>
       <br>
       <div class="button-wrapper">
         <button type="button" id="percent" class="Operators">%</button>
         <button type="button" id="deepclear" class="Operators">CE</button>
         <button type="button" id="clear" class="Operators">C</button>
         <button type="button" id="backspace" class="Operators">⌫</button>
        </div>
        
        <div class="button-wrapper">
          <button type="button" id="fraction" class="Operators">¹/ₓ</button>
          <button type="button" id="square" class="Operators">ₓ²</button>
          <button type="button" id="square-root" class="Operators"><span style="font-size: 14px;">√ₓ</span></button>
          <button type="button" id="division" class="Operators">÷</button>
      </div>
      
      <div class="button-wrapper">
        <button type="button" id="seven" class="Numbers">7</button>
        <button type="button" id="eight" class="Numbers">8</button>
        <button type="button" id="nine" class="Numbers">9</button>
        <button type="button" id="multiplication" class="Operators">x</button>
      </div>
      
      <div class="button-wrapper">
        <button type="button" id="four" class="Numbers">4</button>
        <button type="button" id="five" class="Numbers">5</button>
        <button type="button" id="six" class="Numbers">6</button>
        <button type="button" id="subtraction" class="Operators">_</button>
      </div> 
      
      <div class="button-wrapper">
        <button type="button" id="one" class="Numbers">1</button>
        <button type="button" id="two" class="Numbers">2</button>
        <button type="button" id="three" class="Numbers">3</button>
        <button type="button" id="addition" class="Operators">+</button>
      </div>
      
      <div class="button-wrapper">
        <button type="button" id="plus-minus" class="Numbers">+/-</button>
        <button type="button" id="zero" class="Numbers">0</button>
        <button type="button" id="decimalpoint" class="Numbers">.</button>
        <button type="button" id="equalsign">=</button>
      </div>
    </div>
    <footer>
      © 2026 Temitope Emmanuel — Calculator App
    </footer>
    <script src="calculator.js"></script>
  </body>
  </html>
